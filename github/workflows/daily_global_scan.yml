name: Daily Global Politician Idea Scan & Site Builder

on:
  schedule:
    - cron: '0 7 * * *'  # Runs daily at 07:00 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scan-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Global Politician Tracker & Generate Portal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and push updated data and static site
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/proposals.json docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: daily global politician idea & Vot in Timp update"
          git push
